name: Sync Microsoft 365 Calendar

on:
  push:
    branches:
      - main

  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install calendar libraries
        run: |
          python -m pip install --upgrade pip
          pip install icalendar recurring-ical-events python-dateutil

      - name: Build calendar
        env:
          M365_CALENDAR_ICS_URL: ${{ secrets.M365_CALENDAR_ICS_URL }}
          M365_CALENDAR_HTML_URL: ${{ secrets.M365_CALENDAR_HTML_URL }}
        run: |
          python scripts/build-calendar.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
